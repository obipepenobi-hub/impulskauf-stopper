name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Dry run of the whole pipeline (tests, build, signing, signature check) that publishes nothing -
  # lets signing changes be tested without creating a tag or a release.
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run version (x.y.z). Builds and signs, but publishes nothing."
        required: true
        default: "0.0.1"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # needed only to create the GitHub Release on tag pushes
    steps:
      # Third-party actions are pinned to a commit hash (the comment names the version it was
      # taken from): a tag like "v4" can be moved afterwards, a commit hash cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship a full Android SDK (ANDROID_HOME is preset) -
      # android-actions/setup-android@v3 additionally tries to install the long-deprecated
      # "tools" package, which Google has since removed from the SDK repository, breaking
      # this step entirely. Skipping the action avoids that failure.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got: $VERSION"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set version from tag
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.version }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${{ steps.version.outputs.code }}/" app/build.gradle.kts

      # Robolectric downloads a ~150 MB Android framework jar per SDK level on first use.
      - name: Cache Robolectric Android jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      # A release never ships with a failing test - the tests cover the security behaviour.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble unsigned release APK
        run: ./gradlew assembleRelease -PunsignedRelease=true --stacktrace

      - name: Sign release APK (new key + key-rotation lineage) and verify the signature
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::the release signing secrets (RELEASE_KEYSTORE_B64, RELEASE_KEYSTORE_PASSWORD) are not set"
            exit 1
          fi
          umask 077
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          mkdir -p out
          bash scripts/sign-release.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "out/impulskauf-stopper-${{ steps.version.outputs.version }}.apk"

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*.apk
          generate_release_notes: true

      - name: Upload signed APK (dry run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-apk-dry-run
          path: out/*.apk
          retention-days: 1
